<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Prototipo Ancoa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Prototipo navegable de alta fidelidad · Only Simple Solutions · Caso 09 Multitiendas Ancoa">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<style>
/* Sistema de diseño "Cordillera" — Only Simple Solutions para Multitiendas Ancoa.
   Retícula: cabecera de ámbito + navegación lateral + contenido en columnas de 12, espaciado base 4 px.
   Paleta principal (5): Carmín Retail, Bosque Filial, Tinta, Papel, Señal ámbar. Los tonos suaves derivan de ellos. */
:root{
  --retail:#990B23; --filial:#206234; --ink:#22191B; --paper:#FAF7F7; --signal:#A35A00;
  --surface:#FFFFFF; --surface-2:#F3EDED; --line:#E2D7D9; --line-strong:#C9B9BC; --muted:#665A5D;
  --retail-fg:#990B23; --filial-fg:#206234;
  --retail-soft:#F8E6E9; --filial-soft:#E3F0E6; --signal-soft:#FFF1DC; --ink-soft:#EEE8E9;
  --signal-fg:#8A4B00; --err:#B3122E; --err-soft:#FBE7EA; --ok:#206234; --ok-soft:#E3F0E6;
  --on-brand:#FFFFFF; --photo-bg:#E6E1DB; --chrome:#22191B; --on-chrome:#FAF7F7; --overlay:rgba(34,25,27,.48); --shadow:0 1px 2px rgba(34,25,27,.06),0 8px 24px rgba(34,25,27,.08);
  --brand:var(--retail); --brand-fg:var(--retail-fg); --brand-soft:var(--retail-soft);
  --display:"Source Serif 4",Georgia,"Times New Roman",serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-sm:6px; --r:10px; --r-lg:16px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --t-xs:.75rem; --t-sm:.875rem; --t-md:1rem; --t-lg:1.125rem; --t-xl:1.375rem; --t-2xl:1.75rem; --t-3xl:2.25rem;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#F2EAEB; --paper:#141011; --surface:#1D1618; --surface-2:#271F21; --line:#3A2F32; --line-strong:#56474B; --muted:#B9ABAE;
  --retail-fg:#F28A9B; --filial-fg:#7CCB95; --retail-soft:#3A1820; --filial-soft:#16301F; --signal-soft:#3A2810; --ink-soft:#2A2224;
  --signal-fg:#F2B866; --err:#FF8597; --err-soft:#3D1820; --ok:#7CCB95; --ok-soft:#16301F;
  --overlay:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --ink:#F2EAEB; --paper:#141011; --surface:#1D1618; --surface-2:#271F21; --line:#3A2F32; --line-strong:#56474B; --muted:#B9ABAE;
  --retail-fg:#F28A9B; --filial-fg:#7CCB95; --retail-soft:#3A1820; --filial-soft:#16301F; --signal-soft:#3A2810; --ink-soft:#2A2224;
  --signal-fg:#F2B866; --err:#FF8597; --err-soft:#3D1820; --ok:#7CCB95; --ok-soft:#16301F;
  --overlay:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
body[data-scope="filial"]{--brand:var(--filial); --brand-fg:var(--filial-fg); --brand-soft:var(--filial-soft)}

*{box-sizing:border-box}
html,body{height:100%}
body{overflow-x:clip}

h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:var(--t-2xl)} h2{font-size:var(--t-xl)} h3{font-size:var(--t-lg)}
p{margin:0} a{color:var(--brand-fg)} a:hover{text-decoration-thickness:2px}
:focus-visible{outline:3px solid var(--brand-fg);outline-offset:2px;border-radius:4px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;z-index:100;background:var(--surface);padding:10px 14px;border-radius:var(--r-sm)}
.skip:focus{top:8px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:var(--t-sm)} .xs{font-size:var(--t-xs)}
.eyebrow{font-size:var(--t-xs);letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:var(--s4)} .stack-sm{display:flex;flex-direction:column;gap:var(--s2)}
.row{display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap} .row-between{display:flex;gap:var(--s3);align-items:center;justify-content:space-between;flex-wrap:wrap}
.grid{display:grid;gap:var(--s4)} .g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:var(--s5);align-items:start}
.grow{flex:1;min-width:0}

/* ---------- Cabecera y estructura ---------- */
.band{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--brand);color:var(--on-brand)}
.band-in{display:flex;align-items:center;gap:var(--s3);min-height:64px;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;min-height:44px}
.brand img{height:46px;width:auto;display:block}
.scope-tag{font-size:var(--t-xs);letter-spacing:.08em;text-transform:uppercase;font-weight:700;border:1px solid rgba(255,255,255,.55);border-radius:999px;padding:3px 10px;white-space:nowrap}
.band .spacer{flex:1}
.iconbtn{display:inline-grid;place-items:center;min-width:44px;min-height:44px;border-radius:var(--r);border:0;background:transparent;color:inherit;cursor:pointer;position:relative;font:inherit}
.band .iconbtn:hover{background:rgba(255,255,255,.14)}
.iconbtn svg{width:22px;height:22px}
.dot{position:absolute;top:8px;right:8px;width:9px;height:9px;border-radius:50%;background:#FFD08A;border:2px solid var(--brand)}
.who{display:flex;align-items:center;gap:10px;border:0;background:rgba(255,255,255,.12);color:inherit;border-radius:999px;padding:4px 12px 4px 4px;min-height:44px;cursor:pointer;font:inherit}
.who:hover{background:rgba(255,255,255,.2)}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--brand-fg);font-weight:700;font-size:var(--t-sm)}
.who .meta{display:flex;flex-direction:column;line-height:1.15;text-align:left}
.who .meta b{font-size:var(--t-sm)} .who .meta span{font-size:var(--t-xs);opacity:.85}
.pub-nav{display:flex;gap:var(--s2)}
.pub-nav a{color:inherit;text-decoration:none;padding:10px 12px;border-radius:var(--r);min-height:44px;display:inline-flex;align-items:center}
.pub-nav a:hover{background:rgba(255,255,255,.14)}

.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:calc(100% - 64px)}
.app.public{grid-template-columns:minmax(0,1fr)}
.side{background:var(--surface);border-right:1px solid var(--line);padding:var(--s4) var(--s3);position:sticky;top:calc(64px + env(safe-area-inset-top,0px));height:calc(100vh - 64px - env(safe-area-inset-top,0px));overflow:auto}
.side h2{font-family:var(--body);font-size:var(--t-xs);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:var(--s4) var(--s3) var(--s2)}
.side h2:first-child{margin-top:0}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r);color:var(--ink);text-decoration:none;min-height:44px;font-weight:500}
.nav a svg{width:20px;height:20px;flex:none;color:var(--muted)}
.nav a:hover{background:var(--surface-2)}
.nav a[aria-current="page"]{background:var(--brand-soft);color:var(--brand-fg);font-weight:700}
.nav a[aria-current="page"] svg{color:var(--brand-fg)}
.side .scope-note{margin:var(--s5) var(--s3) 0;padding:var(--s3);border-radius:var(--r);background:var(--surface-2);font-size:var(--t-xs);color:var(--muted)}
main{min-width:0;padding-block:var(--s5) 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:var(--s5);animation:enter .22s ease-out}
@keyframes enter{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
.crumbs ol{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0;font-size:var(--t-sm);color:var(--muted)}
.crumbs li+li::before{content:"/";margin-right:6px;color:var(--line-strong)}
.crumbs a{color:var(--muted)} .crumbs [aria-current]{color:var(--ink);font-weight:600}
.page-head{display:flex;gap:var(--s4);align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.page-head .lead{max-width:68ch;color:var(--muted);margin-top:6px}
.subnav{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.subnav a{padding:10px 14px;text-decoration:none;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;min-height:44px;display:inline-flex;align-items:center;font-weight:600}
.subnav a[aria-current="page"]{color:var(--brand-fg);border-color:var(--brand)}

/* ---------- Superficies ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s5)}
.card.tight{padding:var(--s4)}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);margin-bottom:var(--s4);flex-wrap:wrap}
.card-head h2,.card-head h3{font-size:var(--t-lg)}
.panel{background:var(--surface-2);border-radius:var(--r);padding:var(--s4)}
.divider{height:1px;background:var(--line);border:0;margin:0}
.kv{display:grid;grid-template-columns:minmax(120px,max-content) 1fr;gap:6px var(--s4);font-size:var(--t-sm)}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600;min-width:0}

/* ---------- Botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:var(--r);border:1px solid transparent;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s,transform .05s}
.btn:active{transform:translateY(1px)}
.btn svg{width:18px;height:18px}
.btn-primary{background:var(--brand);color:var(--on-brand)}
.btn-primary:hover{filter:brightness(1.12)}
.btn-secondary{background:var(--surface);color:var(--ink);border-color:var(--line-strong)}
.btn-secondary:hover{background:var(--surface-2)}
.btn-tertiary{background:transparent;color:var(--brand-fg);padding:0 10px}
.btn-tertiary:hover{background:var(--brand-soft)}
.btn-danger{background:var(--err);color:#fff} :root[data-theme="dark"] .btn-danger{color:#22191B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn-danger{color:#22191B}}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed;filter:none}
.btn-sm{min-height:36px;padding:0 12px;font-size:var(--t-sm)}
.btn-block{width:100%}
.btn.loading{pointer-events:none;opacity:.85}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:rot .7s linear infinite;display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}
.fab{position:fixed;right:calc(24px + env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;min-height:56px;border-radius:999px;padding:0 22px;box-shadow:var(--shadow)}

/* ---------- Distintivos ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:var(--t-xs);font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap;line-height:1.5;border:1px solid transparent}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.badge.plain::before{display:none}
.b-ok{background:var(--ok-soft);color:var(--ok)} .b-err{background:var(--err-soft);color:var(--err)}
.b-warn{background:var(--signal-soft);color:var(--signal-fg)} .b-info{background:var(--ink-soft);color:var(--ink)}
.b-brand{background:var(--brand-soft);color:var(--brand-fg)} .b-line{border-color:var(--line-strong);color:var(--muted);background:transparent}
.st-exigido{background:var(--ink-soft);color:var(--ink)} .st-propuesto{background:var(--brand-soft);color:var(--brand-fg)} .st-pendiente{background:var(--signal-soft);color:var(--signal-fg)}
.pending{display:inline-flex;align-items:center;gap:6px;font-size:var(--t-xs);font-weight:700;color:var(--signal-fg);background:var(--signal-soft);border:1px dashed var(--signal);border-radius:var(--r-sm);padding:3px 8px}

/* ---------- Mensajes ---------- */
.banner{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--r);border:1px solid;font-size:var(--t-sm)}
.banner svg{width:20px;height:20px;flex:none;margin-top:1px}
.banner .grow>b{display:block;font-size:var(--t-md)}
.banner .grow>*+*{margin-top:4px}
.bn-ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 35%,transparent);color:var(--ink)} .bn-ok svg{color:var(--ok)}
.bn-err{background:var(--err-soft);border-color:color-mix(in srgb,var(--err) 35%,transparent);color:var(--ink)} .bn-err svg{color:var(--err)}
.bn-warn{background:var(--signal-soft);border-color:color-mix(in srgb,var(--signal) 45%,transparent);color:var(--ink)} .bn-warn svg{color:var(--signal-fg)}
.bn-info{background:var(--surface-2);border-color:var(--line);color:var(--ink)} .bn-info svg{color:var(--muted)}
#toasts{position:fixed;z-index:90;right:calc(16px + env(safe-area-inset-right,0px));top:calc(76px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px;width:min(380px,calc(100vw - 32px))}
.toast{background:var(--ink);color:var(--paper);border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;align-items:flex-start;box-shadow:var(--shadow);animation:tin .2s ease-out;font-size:var(--t-sm)}
.toast svg{width:18px;height:18px;flex:none;margin-top:2px}
.toast .x{margin-left:auto;background:none;border:0;color:inherit;cursor:pointer;min-width:32px;min-height:32px;opacity:.8}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}

/* ---------- Modal ---------- */
.scrim{position:fixed;inset:0;z-index:80;background:var(--overlay);display:grid;place-items:center;padding:16px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--surface);color:var(--ink);border-radius:var(--r-lg);width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:var(--shadow);animation:pop .18s ease-out}
.modal.wide{width:min(820px,100%)}
@keyframes pop{from{transform:scale(.97);opacity:0}}
.modal header{padding:20px 24px 0;display:flex;gap:12px;align-items:flex-start}
.modal header h2{font-size:var(--t-xl);flex:1}
.modal .body{padding:16px 24px;display:flex;flex-direction:column;gap:14px}
.modal footer{padding:0 24px 20px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

/* ---------- Formularios ---------- */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.field .lbl{font-weight:600;font-size:var(--t-sm)}
.field .hint{font-size:var(--t-xs);color:var(--muted)}
.field .msg{font-size:var(--t-xs);font-weight:600;display:flex;gap:6px;align-items:center;min-height:1.2em}
.field.invalid .msg{color:var(--err)} .field.valid .msg{color:var(--ok)}
.input,select.input,textarea.input{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line-strong);border-radius:var(--r);background:var(--surface);color:var(--ink);font:inherit}
textarea.input{min-height:96px;resize:vertical}
.input:hover{border-color:var(--muted)}
.input:focus{outline:none;border-color:var(--brand-fg);box-shadow:0 0 0 3px var(--brand-soft)}
.field.invalid .input{border-color:var(--err)} .field.valid .input{border-color:var(--ok)}
.input-icon{position:relative} .input-icon svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none}
.input-icon .input{padding-left:40px}
.check{display:flex;gap:10px;align-items:flex-start;min-height:44px;padding:10px 0;cursor:pointer}
.check input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--brand);flex:none}
.opt-cards{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line-strong);border-radius:var(--r);padding:14px;cursor:pointer;background:var(--surface)}
.opt:hover{border-color:var(--muted)}
.opt:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.opt input{width:20px;height:20px;accent-color:var(--brand);margin:2px 0 0;flex:none}
.opt[aria-disabled="true"]{opacity:.6;cursor:not-allowed}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;min-height:44px}
.switch input{appearance:none;width:44px;height:26px;border-radius:999px;background:var(--line-strong);position:relative;cursor:pointer;margin:0;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked{background:var(--brand)} .switch input:checked::after{transform:translateX(18px)}
.ac{position:relative}
.ac-list{position:absolute;z-index:30;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r);box-shadow:var(--shadow);list-style:none;margin:0;padding:6px;max-height:280px;overflow:auto}
.ac-list li{padding:10px 12px;border-radius:var(--r-sm);cursor:pointer;min-height:44px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.ac-list li[aria-selected="true"],.ac-list li:hover{background:var(--brand-soft)}
.ac-list mark{background:none;color:var(--brand-fg);font-weight:700}
.drop{border:2px dashed var(--line-strong);border-radius:var(--r-lg);padding:24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--surface-2);cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--brand);background:var(--brand-soft)}
.drop svg{width:32px;height:32px;color:var(--brand-fg)}
.files{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.files li{display:flex;gap:10px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);font-size:var(--t-sm)}
.meter{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.meter>i{display:block;height:100%;background:var(--brand);border-radius:999px;transition:width .3s}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line-strong);border-radius:var(--r)}
.qty button{min-width:44px;min-height:44px;border:0;background:none;color:var(--ink);font-size:1.2rem;cursor:pointer}
.qty output{min-width:28px;text-align:center;font-weight:700}

/* ---------- Pasos, pestañas, acordeón ---------- */
.steps{display:flex;gap:6px;list-style:none;margin:0;padding:0;counter-reset:st;overflow-x:auto}
.steps li{flex:1;min-width:92px;display:flex;flex-direction:column;gap:6px;font-size:var(--t-xs);color:var(--muted);font-weight:600}
.steps li::before{counter-increment:st;content:counter(st);display:grid;place-items:center;width:30px;height:30px;border-radius:50%;border:2px solid var(--line-strong);background:var(--surface);font-weight:700}
.steps li::after{content:"";height:3px;border-radius:2px;background:var(--line)}
.steps li.done{color:var(--ink)} .steps li.done::before{content:"✓";background:var(--brand);border-color:var(--brand);color:var(--on-brand)} .steps li.done::after{background:var(--brand)}
.steps li.cur{color:var(--brand-fg)} .steps li.cur::before{border-color:var(--brand);color:var(--brand-fg)} .steps li.cur::after{background:linear-gradient(90deg,var(--brand) 50%,var(--line) 50%)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;min-height:44px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--brand-fg);border-color:var(--brand)}
.tabs button:hover{color:var(--ink)}
details.acc{border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
details.acc+details.acc{margin-top:8px}
details.acc summary{padding:14px 16px;cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px;min-height:44px}
details.acc summary::after{content:"+";font-size:1.2rem;color:var(--muted)} details.acc[open] summary::after{content:"–"}
details.acc .in{padding:0 16px 16px;font-size:var(--t-sm)}

/* ---------- Tablas ---------- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.tbl{width:100%;border-collapse:collapse;font-size:var(--t-sm)}
.tbl th{text-align:left;font-size:var(--t-xs);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.tbl th button{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center;min-height:32px}
.tbl th button:focus-visible{outline:3px solid var(--brand-fg)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl tr.sel{background:var(--brand-soft)}
.tbl td.r,.tbl th.r{text-align:right}
.tbl input[type=checkbox]{width:20px;height:20px;accent-color:var(--brand)}
.tbl .rowbtn{all:unset;cursor:pointer;color:var(--brand-fg);font-weight:600}
.tbl .rowbtn:hover{text-decoration:underline}
.toolbar{display:flex;gap:var(--s3);flex-wrap:wrap;align-items:flex-end}
.toolbar .field{min-width:160px}
.bulk{display:flex;gap:10px;align-items:center;padding:8px 12px;background:var(--brand-soft);border-radius:var(--r);flex-wrap:wrap}
.pager{display:flex;gap:6px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:var(--t-sm)}
.pager .pg{display:flex;gap:4px}
.pager button{min-width:40px;min-height:40px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r-sm);cursor:pointer;font:inherit}
.pager button[aria-current="page"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.pager button:disabled{opacity:.4;cursor:not-allowed}
.menu{position:absolute;z-index:70;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r);box-shadow:var(--shadow);padding:6px;min-width:220px;display:flex;flex-direction:column}
.menu button,.menu a{all:unset;display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:var(--r-sm);cursor:pointer;min-height:24px;color:var(--ink);font-size:var(--t-sm)}
.menu button:hover,.menu a:hover,.menu button:focus-visible,.menu a:focus-visible{background:var(--surface-2)}
.menu .sep{height:1px;background:var(--line);margin:4px 0}
.menu .grp{font-size:var(--t-xs);color:var(--muted);padding:8px 12px 4px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.menu svg{width:18px;height:18px}

/* ---------- Información ---------- */
.tip{position:relative;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;border:0;background:var(--surface-2);color:var(--muted);cursor:help;font-weight:700;font-size:var(--t-xs);vertical-align:middle}
.tip>span{display:none;position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);width:max-content;max-width:min(260px,70vw);background:var(--ink);color:var(--paper);padding:8px 10px;border-radius:var(--r-sm);font-weight:500;font-size:var(--t-xs);line-height:1.4;opacity:0;pointer-events:none;transition:opacity .15s;z-index:20;text-align:left}
.tip:hover>span,.tip:focus>span{display:block;opacity:1}
.kpi{display:flex;flex-direction:column;gap:4px;padding:var(--s4);border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);text-align:left;font:inherit;color:inherit;min-width:0}
button.kpi{cursor:pointer} button.kpi:hover{border-color:var(--brand)}
.kpi .v{font-family:var(--display);font-size:var(--t-2xl);font-weight:600;font-variant-numeric:tabular-nums}
.kpi .d{font-size:var(--t-xs);font-weight:700}
.up{color:var(--ok)} .down{color:var(--err)}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.timeline li{display:grid;grid-template-columns:28px 1fr;gap:12px;padding-bottom:18px;position:relative}
.timeline li::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line)}
.timeline li:last-child::before{display:none}
.timeline .pt{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line-strong);background:var(--surface);font-size:13px;font-weight:700}
.timeline li.done .pt{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.timeline li.done::before{background:var(--brand)}
.timeline li.cur .pt{border-color:var(--brand);color:var(--brand-fg);box-shadow:0 0 0 4px var(--brand-soft)}
.timeline li.alert .pt{border-color:var(--signal);background:var(--signal-soft);color:var(--signal-fg)}
.timeline li.blocked .pt{border-style:dashed}
.timeline b{display:block}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:40px 16px;color:var(--muted)}
.empty svg{width:140px;height:auto}
.empty b{color:var(--ink);font-family:var(--display);font-size:var(--t-lg)}
.skel{background:linear-gradient(90deg,var(--surface-2) 25%,var(--line) 37%,var(--surface-2) 63%);background-size:400% 100%;animation:sk 1.2s ease infinite;border-radius:var(--r-sm)}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
.lock{display:flex;gap:12px;align-items:center;padding:14px;border-radius:var(--r);border:1px dashed var(--line-strong);background:var(--surface-2);font-size:var(--t-sm)}
.lock svg{width:22px;height:22px;color:var(--muted);flex:none}

/* ---------- Comercio ---------- */
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:var(--s4)}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;display:flex;flex-direction:column;color:inherit;text-decoration:none;transition:border-color .15s,box-shadow .15s}
.pcard:hover{border-color:var(--brand);box-shadow:var(--shadow)}
.pcard .ph{position:relative;aspect-ratio:1/1;max-width:100%;background:var(--photo-bg);overflow:hidden}
.pcard .ph svg{width:46%;height:auto}
.pcard .pb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.pcard .nm{font-weight:600;line-height:1.3}
.price{font-family:var(--display);font-weight:700;font-size:var(--t-xl);font-variant-numeric:tabular-nums}
.was{text-decoration:line-through;color:var(--muted);font-size:var(--t-sm)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 14px;border:1px solid var(--line-strong);border-radius:999px;background:var(--surface);color:var(--ink);font:inherit;font-size:var(--t-sm);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-fg);font-weight:700}
.chip:disabled{opacity:.45;cursor:not-allowed;text-decoration:line-through}
.line{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.line .th{width:64px;height:64px;border-radius:var(--r);display:grid;place-items:center}
.line .th svg{width:34px}
.sum{display:flex;justify-content:space-between;padding:6px 0;font-size:var(--t-sm)}
.sum.total{font-size:var(--t-lg);font-weight:700;border-top:1px solid var(--line);padding-top:12px;margin-top:6px}

/* ---------- POS ---------- */
.pos{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:var(--s4)}
.pos-status{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);font-size:var(--t-sm)}
.pos-status.off{background:var(--signal-soft);border-color:var(--signal)}
.link-led{width:12px;height:12px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px var(--ok-soft)}
.off .link-led{background:var(--signal);box-shadow:0 0 0 4px rgba(163,90,0,.2);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.35}}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keys .btn{min-height:56px;font-size:var(--t-lg)}
kbd{font-family:ui-monospace,Menlo,monospace;font-size:.75em;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:1px 5px;background:var(--surface)}

/* ---------- Teléfono ---------- */
.phone{width:375px;max-width:100%;margin:0 auto;border:10px solid var(--ink);border-radius:40px;overflow:hidden;background:var(--paper);box-shadow:var(--shadow)}
.phone .scr{height:740px;max-height:75vh;overflow:auto;display:flex;flex-direction:column}
.phone .top{background:var(--brand);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}
.phone .top img{height:30px}
.phone .ct{padding:14px;display:flex;flex-direction:column;gap:12px;flex:1}
.phone .bot{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:var(--surface);position:sticky;bottom:0}
.phone .bot button{min-height:56px;border:0;background:none;color:var(--muted);font:inherit;font-size:var(--t-xs);font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.phone .bot button svg{width:20px;height:20px}
.phone .bot button[aria-selected="true"]{color:var(--brand-fg)}

/* ---------- Gráficos ---------- */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--body);font-size:11px}
.chart .grid line{stroke:var(--line);stroke-width:1}
.chart .lbl-strong{fill:var(--ink);font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:var(--t-xs);color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chart-card{display:flex;flex-direction:column;gap:10px;min-width:0}
.chart-card .card-head{margin-bottom:0}

/* ---------- Tour ---------- */
.tour-hole{position:fixed;z-index:85;border-radius:var(--r);box-shadow:0 0 0 9999px var(--overlay);pointer-events:none;transition:all .25s ease}
.tour-pop{position:fixed;z-index:86;background:var(--surface);color:var(--ink);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:18px;width:min(340px,calc(100vw - 32px));display:flex;flex-direction:column;gap:10px}

/* ---------- Panel de revisión (fuera de la interfaz de Ancoa) ---------- */
.review{position:fixed;left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:45}
.review>button{display:inline-flex;align-items:center;gap:8px;min-height:40px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:var(--chrome);color:var(--on-chrome);font:inherit;font-size:var(--t-xs);font-weight:700;padding:0 14px;cursor:pointer;box-shadow:var(--shadow)}
.review>button svg{width:16px;height:16px}
.revpanel{position:fixed;z-index:75;top:calc(76px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(360px,calc(100vw - 24px));background:var(--chrome);color:var(--on-chrome);border-radius:var(--r-lg);box-shadow:0 12px 40px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;font-size:var(--t-sm);animation:pop .15s ease-out}
.revpanel header{display:flex;align-items:center;gap:8px;padding:14px 14px 10px 18px;border-bottom:1px solid rgba(255,255,255,.12)}
.revpanel header b{flex:1;font-size:var(--t-md)}
.revpanel .rp-body{overflow:auto;padding:14px 18px 18px;display:flex;flex-direction:column;gap:16px}
.revpanel h3{font-family:var(--body);font-size:var(--t-xs);letter-spacing:.08em;text-transform:uppercase;color:rgba(250,247,247,.7);margin:0 0 8px}
.revpanel .rp-note{color:rgba(250,247,247,.7);font-size:var(--t-xs)}
.revpanel .iconbtn{color:var(--on-chrome)} .revpanel .iconbtn:hover{background:rgba(255,255,255,.1)}
.rp-btns{display:flex;flex-wrap:wrap;gap:6px}
.rp-btns button,.rp-btns a{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid rgba(255,255,255,.28);background:transparent;color:var(--on-chrome);font:inherit;font-size:var(--t-xs);font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.rp-btns button:hover,.rp-btns a:hover{background:rgba(255,255,255,.1)}
.rp-btns [aria-pressed="true"],.rp-btns .on{background:var(--on-chrome);color:var(--chrome);border-color:var(--on-chrome)}
.rp-kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:var(--t-xs)} .rp-kv dt{color:rgba(250,247,247,.65)} .rp-kv dd{margin:0;font-weight:600}
.revpanel .switch{min-height:36px} .revpanel .switch input{background:rgba(255,255,255,.3)} .revpanel .switch input:checked{background:#F28A9B}
.revpanel :focus-visible{outline-color:#F28A9B}
.vtag{display:inline-flex;gap:6px;align-items:center;font-size:var(--t-xs);font-weight:700;font-family:ui-monospace,Menlo,monospace;color:var(--muted);border:1px dashed var(--line-strong);border-radius:var(--r-sm);padding:2px 8px;background:var(--surface)}
@media (max-width:700px){.revpanel{top:auto;height:62vh}}
body:not(.reviewing) .vtag,body:not(.reviewing) .rev-only{display:none!important}
/* ---------- Portada pública ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:var(--s6);align-items:center;padding-block:var(--s6)}
.hero h1{font-size:clamp(2rem,4vw,3.2rem);letter-spacing:-.01em}
.hero .lead{font-size:var(--t-lg);color:var(--muted);max-width:52ch}
.hero-art{background:var(--brand-soft);border-radius:var(--r-lg);padding:var(--s5);display:flex;flex-direction:column;gap:12px}
.promise{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start;background:var(--surface);border-radius:var(--r);padding:14px;border:1px solid var(--line)}
.promise .n{width:40px;height:40px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-family:var(--display);font-weight:700}
.auth{max-width:480px;margin:0 auto;width:100%}
.demo-acc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.demo-acc button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);font:inherit;cursor:pointer;min-height:44px}
.demo-acc button:hover{border-color:var(--brand)}
.demo-acc small{color:var(--muted);font-size:var(--t-xs)}
.otp{display:flex;gap:8px}
.otp input{width:48px;height:56px;text-align:center;font-size:1.4rem;font-weight:700;border:1px solid var(--line-strong);border-radius:var(--r);background:var(--surface);color:var(--ink)}
.otp input:focus{outline:none;border-color:var(--brand-fg);box-shadow:0 0 0 3px var(--brand-soft)}
.widget{position:relative}
.widget.editing{outline:2px dashed var(--brand);outline-offset:4px;cursor:grab}
.widget.dragging{opacity:.4}
.widget-tools{display:flex;gap:4px}
.swatch{border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.swatch .c{height:72px}
.swatch .t{padding:8px 10px;font-size:var(--t-xs)}
.sitemap ul{list-style:none;margin:0;padding-left:18px;border-left:2px solid var(--line)}
.sitemap>ul{padding-left:0;border:0}
.sitemap li{padding:4px 0}
.sitemap a{font-weight:600}

/* ---------- Respuesta por tamaño ---------- */
@media (max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.pos{grid-template-columns:minmax(0,1fr)}}
@media (max-width:1023px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:calc(64px + env(safe-area-inset-top,0px));bottom:0;height:auto;width:min(300px,86vw);z-index:55;transform:translateX(-102%);transition:transform .2s;box-shadow:var(--shadow);padding-left:max(12px,env(safe-area-inset-left,0px))}
  body.nav-open .side{transform:none}
  body.nav-open .nav-scrim{display:block}
  .split{grid-template-columns:minmax(0,1fr)}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}

}
.nav-scrim{display:none;position:fixed;inset:0;z-index:54;background:var(--overlay)}
@media (min-width:1024px){.only-mobile{display:none!important}}
@media (max-width:700px){
  .g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}
  .who .meta,.scope-tag,.pub-nav .hide-sm{display:none}
  .brand img{height:40px}
  h1{font-size:var(--t-xl)}
  .card{padding:var(--s4)}
  .demo-acc{grid-template-columns:minmax(0,1fr)}
  .otp input{width:42px;height:52px}
  .phone{border:0;border-radius:0;box-shadow:none}
  .phone .scr{height:auto;max-height:none}
  .review .vid{max-width:34vw}
  .fab{bottom:calc(72px + env(safe-area-inset-bottom,0px))}
  .kv{grid-template-columns:minmax(0,1fr)}
  .kv dd{margin-bottom:6px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.svc-ic{width:28px;height:28px}

.scope-sw{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.25)}
.scope-sw button{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border:0;border-radius:999px;background:transparent;color:#fff;font:inherit;font-size:var(--t-sm);font-weight:700;cursor:pointer;white-space:nowrap}
.scope-sw button svg{width:16px;height:16px}
.scope-sw button:hover{background:rgba(255,255,255,.14)}
.scope-sw button[aria-pressed="true"]{background:#fff;color:var(--brand)}
.scope-sw button[aria-pressed="true"]:hover{background:#fff}
@media (max-width:700px){.scope-sw button{padding:0 10px}.scope-sw button svg{display:none}}
@media (max-width:700px){.band-in{gap:6px}.band [data-act=quick]{display:none}.who{padding:4px}.scope-sw button{padding:0 9px;font-size:var(--t-xs)}.band .iconbtn{min-width:40px}}
@media (max-width:700px){.scope-sw .hide-sm{display:none}}

/* ---------- Fotografía de producto ---------- */
.photo{display:block;width:100%;height:auto;aspect-ratio:1/1;object-fit:cover;background:var(--photo-bg)}
.pcard .ph .photo{height:100%;transition:transform .35s ease}
.pcard:hover .ph .photo{transform:scale(1.04)}
.dto{position:absolute;top:10px;left:10px;background:var(--brand);color:var(--on-brand);font-weight:800;font-size:var(--t-xs);padding:4px 8px;border-radius:6px;font-variant-numeric:tabular-nums}
.mkt{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.92);color:#22191B;font-size:var(--t-xs);font-weight:700;padding:3px 8px;border-radius:999px}
.brandline{font-size:var(--t-xs);font-weight:700;letter-spacing:.06em;color:var(--muted)}
.stars{color:var(--signal-fg);font-size:var(--t-sm);letter-spacing:1px;white-space:nowrap}
.avail{list-style:none;margin:2px 0 0;padding:0;display:flex;flex-direction:column;gap:2px;font-size:var(--t-xs)}
.avail li::before{content:"✓ ";font-weight:800}
.avail li.ok{color:var(--ok)} .avail li.warn{color:var(--signal-fg);font-weight:700} .avail li.warn::before{content:"! "} .avail li.no{color:var(--muted)} .avail li.no::before{content:"· "}
.gallery{display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;align-items:start}
.gallery .thumbs{display:flex;flex-direction:column;gap:8px}
.gallery .thumbs button{padding:0;border:2px solid transparent;border-radius:10px;overflow:hidden;cursor:pointer;background:var(--photo-bg);width:76px;height:76px}
.gallery .thumbs button img{width:100%;height:100%;object-fit:cover;display:block}
.gallery .thumbs button[aria-pressed="true"]{border-color:var(--brand)}
.gallery .main{border-radius:var(--r-lg);overflow:hidden;background:var(--photo-bg)}
.line .th{overflow:hidden;background:var(--photo-bg)} .line .th .photo{width:100%;height:100%}
@media (max-width:700px){.gallery{grid-template-columns:minmax(0,1fr)}.gallery .thumbs{flex-direction:row;order:2;overflow-x:auto}.gallery .thumbs button{flex:none;width:64px;height:64px}}
.inl{width:1.1em;height:1.1em;vertical-align:-3px}

/* ---------- Inicio de sesión con pestañas ---------- */
.login-card{padding:0;overflow:hidden}
.login-card form{padding:var(--s5)}
.ltabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line);background:var(--surface-2)}
.ltabs a{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;text-decoration:none;color:var(--muted);font-weight:700;border-bottom:3px solid transparent;margin-bottom:-1px}
.ltabs a svg{width:18px;height:18px}
.ltabs a:hover{color:var(--ink);background:var(--surface)}
.ltabs a[aria-current="page"]{color:var(--brand-fg);border-bottom-color:var(--brand);background:var(--surface)}
.login-card.is-col .ltabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
.login-card.is-col .btn-primary{background:var(--ink);color:var(--paper)}
.col-badge{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--ink-soft);color:var(--ink);flex:none}
.col-badge svg{width:18px;height:18px}
@media (max-width:700px){.login-card form{padding:var(--s4)}}
.field .msg svg{width:14px;height:14px;flex:none}
.panel.row>svg{flex:none;color:var(--muted)}

/* ---------- Inicio público Filial emisora ---------- */
.pub-nav button{background:none;border:0;color:inherit;font:inherit;padding:10px 12px;border-radius:var(--r);min-height:44px;cursor:pointer}
.pub-nav button:hover{background:rgba(255,255,255,.14)}
.pub-nav .pub-cta{background:#fff;color:var(--brand);font-weight:700;gap:6px;padding:0 16px;border-radius:999px;margin-left:4px}
.pub-nav .pub-cta:hover{background:#fff;filter:brightness(.95)}
.pub-nav .pub-cta svg{width:16px;height:16px}
.car{border-radius:var(--r-lg);overflow:hidden;background:#174A27;color:#fff;position:relative}
.slide{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:var(--s5);align-items:center;padding:var(--s6) var(--s6) var(--s5);min-height:360px;background:linear-gradient(120deg,#174A27 0%,#206234 55%,#2C7A44 100%);animation:fade .35s}
.slide.sl-solicita{background:linear-gradient(120deg,#0F3A1D,#206234)}
.slide.sl-avance{background:linear-gradient(120deg,#206234,#3D8A55)}
.slide.sl-paga{background:linear-gradient(120deg,#174A27,#1F5D33 60%,#5E9A3A)}
.sl-txt{display:flex;flex-direction:column;gap:12px;min-width:0}
.sl-txt h1{font-size:clamp(1.75rem,3.4vw,2.75rem);color:#fff;letter-spacing:-.01em}
.sl-txt p{color:rgba(255,255,255,.9);max-width:52ch}
.sl-eb{font-size:var(--t-xs);font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#BFE6C9}
.sl-btn{background:#fff;color:#174A27}
.sl-btn:hover{background:#EAF6ED}
.sl-legal{font-size:11px!important;line-height:1.45;color:rgba(255,255,255,.72)!important;max-width:70ch!important}
.sl-art{display:grid;place-items:center;position:relative;min-width:0}
.sl-photo{width:min(300px,100%);height:auto;aspect-ratio:1/1;object-fit:cover;border-radius:50%;border:6px solid rgba(255,255,255,.18);box-shadow:0 20px 50px rgba(0,0,0,.3)}
.sl-num{font-family:var(--display);font-size:clamp(3rem,7vw,5.5rem);font-weight:700;line-height:1;display:flex;flex-direction:column;align-items:center}
.sl-num span{font-size:.5em;align-self:flex-start} .sl-num small{font-family:var(--body);font-size:var(--t-sm);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#BFE6C9;order:-1;margin-bottom:6px}
.sl-badge{position:absolute;right:8%;bottom:8%;display:inline-flex;gap:6px;align-items:center;background:#fff;color:#174A27;font-weight:800;padding:8px 14px;border-radius:999px;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.sl-badge svg{width:16px;height:16px}
.tcard{width:min(320px,100%);aspect-ratio:1.586/1;border-radius:18px;background:linear-gradient(135deg,#3E9658 0%,#206234 45%,#0F3A1D 100%);box-shadow:0 24px 50px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.25);position:relative;transform:rotate(-6deg);padding:18px;color:#fff}
.tcard img{height:56px;width:auto}
.tcard .chip{position:absolute;left:22px;top:46%;width:44px;height:32px;border-radius:6px;background:linear-gradient(135deg,#E9D79A,#B8973F)}
.tcard .tc-name{position:absolute;right:18px;top:20px;font-size:11px;font-weight:800;letter-spacing:.14em}
.tcard .tc-num{position:absolute;left:22px;bottom:18px;font-family:ui-monospace,Menlo,monospace;font-size:15px;letter-spacing:.08em}
.car-ctl{display:flex;justify-content:center;align-items:center;gap:6px;padding:4px 12px 12px;background:transparent;position:absolute;left:0;right:0;bottom:0}
.car-ctl .iconbtn{color:#fff;min-width:40px;min-height:40px} .car-ctl .iconbtn:hover{background:rgba(255,255,255,.14)}
.dots{display:flex;gap:2px}
.dots button{width:28px;height:40px;border:0;background:none;cursor:pointer;display:grid;place-items:center;padding:0}
.dots button::after{content:"";width:9px;height:9px;border-radius:999px;background:rgba(255,255,255,.45);transition:width .2s}
.dots button[aria-current="true"]::after{width:22px;background:#fff}
.slide{padding-bottom:64px}
.quick{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.qa{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:18px 10px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;font-size:var(--t-sm);cursor:pointer}
.qa:hover{border-color:var(--filial);box-shadow:var(--shadow)}
.qa-ic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--filial-soft);color:var(--filial-fg)}
.qa-ic svg{width:22px;height:22px}
.benef{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s4)}
.bcard{border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--surface)}
.b-ph{position:relative;aspect-ratio:4/3;background:var(--photo-bg);overflow:hidden}
.b-ph img{width:100%;height:100%;object-fit:cover;display:block}
.b-tag{position:absolute;left:10px;top:10px;background:var(--filial);color:#fff;font-size:var(--t-xs);font-weight:700;padding:3px 10px;border-radius:999px}
.b-tx{padding:12px 14px 14px}
.b-tx h3{font-size:var(--t-lg);color:var(--filial-fg)}
.sim{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--s6);align-items:start}
.sim-out{background:var(--filial-soft);border-radius:var(--r-lg);padding:var(--s5);display:flex;flex-direction:column;gap:12px}
.sim-big{font-family:var(--display);font-size:var(--t-3xl);font-weight:700;color:var(--filial-fg);line-height:1}
.fin-foot{border-top:1px solid var(--line);padding-top:16px}
.fin-foot a{color:var(--filial-fg)}
@media (max-width:1023px){.quick{grid-template-columns:repeat(3,minmax(0,1fr))}.benef{grid-template-columns:repeat(2,minmax(0,1fr))}.sim{grid-template-columns:minmax(0,1fr)}}
@media (max-width:700px){.slide{grid-template-columns:minmax(0,1fr);padding:var(--s5) var(--s4) 64px;min-height:0}.sl-art{order:-1}.sl-photo{width:160px}.tcard{width:220px}.sl-num{font-size:3rem}.quick{grid-template-columns:repeat(2,minmax(0,1fr))}.quick .qa:last-child{grid-column:span 2}.benef{grid-template-columns:repeat(2,minmax(0,1fr))}.pub-nav .pub-cta{padding:0 12px}}
[hidden]{display:none!important}

/* ---------- Inicio Retail ---------- */
.car-retail{background:#6E0718}
.car-retail .slide{background:linear-gradient(120deg,#6E0718 0%,#990B23 55%,#B8213A 100%)}
.car-retail .slide.sl-r-trail{background:linear-gradient(120deg,#4F0512,#990B23)}
.car-retail .slide.sl-r-retiro{background:linear-gradient(120deg,#990B23,#C2364C)}
.car-retail .slide.sl-r-tarjeta{background:linear-gradient(120deg,#6E0718,#990B23 55%,#206234 140%)}
.car-retail .sl-eb{color:#FFD0D7}
.car-retail .sl-btn{color:#990B23} .car-retail .sl-btn:hover{background:#FDECEF}
.car-retail .sl-badge{color:#990B23}
.sl-h{font-size:clamp(1.75rem,3.4vw,2.75rem);color:#fff;letter-spacing:-.01em}
.qa-r:hover{border-color:var(--retail)}
.qa-r .qa-ic{background:var(--retail-soft);color:var(--retail-fg)}
.catrow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px}
.catc{display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font-weight:600;font-size:var(--t-sm);text-align:center}
.catc-ph{width:100%;max-width:132px;aspect-ratio:1/1;border-radius:50%;overflow:hidden;background:var(--photo-bg);border:2px solid transparent;transition:border-color .15s}
.catc-ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.catc:hover .catc-ph{border-color:var(--retail)} .catc:hover .catc-ph img{transform:scale(1.06)}
.bcard-r{text-decoration:none;color:inherit;display:block;transition:border-color .15s,box-shadow .15s}
.bcard-r:hover{border-color:var(--retail);box-shadow:var(--shadow)}
.bcard-r .b-tag{background:var(--retail)}
.bcard-r .b-tx h3{color:var(--retail-fg)}
.rfoot{border-top:1px solid var(--line);padding-top:20px;display:flex;flex-direction:column;gap:16px}
.rfoot-cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s5)}
.rfoot b{font-size:var(--t-sm)}
.rfoot a,.rfoot button{background:none;border:0;padding:0;font:inherit;font-size:var(--t-sm);color:var(--muted);text-align:left;cursor:pointer;text-decoration:none;min-height:28px}
.rfoot a:hover,.rfoot button:hover{color:var(--brand-fg);text-decoration:underline}
@media (max-width:1023px){.catrow{grid-template-columns:repeat(4,minmax(0,1fr))}.rfoot-cols{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){.catrow{display:flex;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}.catc{flex:0 0 96px;scroll-snap-align:start}.rfoot-cols{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){.products{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.pcard .pb{padding:10px}.pcard .nm{font-size:var(--t-sm)}.pcard .price{font-size:var(--t-lg)}.pcard .avail{font-size:11px}.dto{top:6px;left:6px}.mkt{top:6px;right:6px;font-size:10px}}

function chFunnel(data){const W=520,rh=36,mx=data[0].v;return `<svg class="chart" viewBox="0 0 ${W} ${data.length*(rh+8)}" role="img" aria-label="Gráfico de embudo">${data.map((d,i)=>{const w=(W-170)*d.v/mx;return `<rect x="${(W-170-w)/2}" y="${i*(rh+8)}" width="${w}" height="${rh}" rx="6" fill="var(--retail)" fill-opacity="${1-i*.15}"><title>${esc(d.l)}: ${fmtN(d.v)}</title></rect><text x="${W-160}" y="${i*(rh+8)+rh/2+4}" class="lbl-strong">${esc(d.l)}</text><text x="${W-6}" y="${i*(rh+8)+rh/2+4}" text-anchor="end">${fmtN(d.v)}</text>`}).join('')}</svg>`}

const ACCOUNTS={'valentina.rojas@correo.cl':['cliente'],'16.054.321-3':['cliente'],'personal.tienda@ancoa.cl':['cajero','tienda'],'casa.matriz@ancoa.cl':['atencion','comercial','logistica','analista','admin'],'d.ortiz@filial.ancoa.cl':['ejecutivo'],'cuenta.suspendida@ancoa.cl':[]};
const isStaff=m=>/@(filial\.)?ancoa\.cl$/i.test(m), isFilial=m=>/@filial\.ancoa\.cl$/i.test(m);
const loginTabs=cur=>`<nav class="ltabs" aria-label="Tipo de cuenta"><a href="#acceso" ${cur==='cli'?'aria-current="page"':''}>${ic('user')}Clientes</a><a href="#colaboradores" ${cur==='col'?'aria-current="page"':''}>${ic('store')}Colaboradores</a></nav>`;
const passField=()=>`<div class="field" data-f="l-pass"><label for="l-pass">Contraseña <span aria-hidden="true" class="muted">*</span></label><div class="row" style="flex-wrap:nowrap"><input class="input" id="l-pass" type="password" required autocomplete="current-password"><button type="button" class="btn btn-secondary" id="l-eye" aria-pressed="false" aria-label="Mostrar contraseña">${ic('eye')}</button></div><span class="msg" id="l-pass-m"></span></div>`;
function loginView(tab){const col=tab==='col';
 return {crumbs:[['Inicio','inicio'],[col?'Entrar · Colaboradores':'Entrar']],title:'Entrar a Ancoa',lead:col?'Acceso para el personal de tiendas, centros de distribución y casa matriz.':'Revisa tus pedidos, devoluciones y datos de tu cuenta.',
 rev:{note:col?'Pestaña Colaboradores de la misma pantalla unificada (B25 §25.2). Valida el dominio corporativo, ofrece los perfiles habilitados de la cuenta y deriva las cuentas de la Filial a su acceso financiero separado (V33).':'Pestaña Clientes de la pantalla unificada (B25 §25.2). Acepta correo o RUT. Una cuenta corporativa ingresada aquí se deriva a la pestaña Colaboradores.'},
 body:`<div class="auth stack"><div class="card login-card ${col?'is-col':''}">${loginTabs(tab)}<form class="stack" id="f-login" novalidate>
  ${col?`<div class="row" style="gap:10px;flex-wrap:nowrap"><span class="col-badge">${ic('shield')}</span><p class="small muted">Uso exclusivo del personal de Multitiendas Ancoa S.A. Los accesos quedan registrados.</p></div>`:''}
  <div id="login-msg" aria-live="assertive"></div>
  ${col?field({id:'l-mail',label:'Usuario corporativo',type:'email',req:true,ph:'nombre@ancoa.cl',attrs:'autocomplete="username"'}):field({id:'l-mail',label:'Correo o RUT',req:true,ph:'nombre@correo.cl o 12.345.678-5',attrs:'autocomplete="username"'})}
  ${passField()}
  <div id="l-prof"></div>
  <div class="row-between"><label class="check"><input type="checkbox" id="l-rem"> ${col?'Mantener sesión en este equipo de tienda':'Recordar este dispositivo'}</label><a href="#recuperar" data-rec="${tab}">${col?'¿Problemas para entrar?':'¿Olvidaste tu contraseña?'}</a></div>
  <button class="btn btn-primary btn-block" id="l-go">${col?'Entrar al portal':'Entrar'}</button>
  ${col?`<div class="panel small row" style="gap:10px;flex-wrap:nowrap">${ic('card')}<span>¿Trabajas en la Filial emisora? Entra por el <a href="#filial" style="color:var(--filial-fg);font-weight:700">acceso financiero</a>, con tu cuenta @filial.ancoa.cl.</span></div><p class="xs muted" style="text-align:center">Mesa de ayuda: mesadeayuda@ancoa.cl · anexo 4400</p>`:`<p class="small muted" style="text-align:center">¿Aún no tienes cuenta? <a href="#registro">Crear cuenta</a></p>`}
 </form></div></div>`,
 mount(){const mail=$('#l-mail'),pass=$('#l-pass');let tries=5;
  if(S.loginPrefill){mail.value=S.loginPrefill;S.loginPrefill=null}
  const norm=v=>{v=v.trim().toLowerCase();return V.rut(v)?fmtRut(v):v};
  const profPick=()=>{const p=col&&ACCOUNTS[norm(mail.value)];$('#l-prof').innerHTML=p&&p.length>1&&!isFilial(norm(mail.value))?`<fieldset class="field" style="border:0;padding:0;margin:0"><legend class="lbl">Perfil con el que trabajarás hoy</legend><div class="opt-cards">${p.map((k,i)=>`<label class="opt"><input type="radio" name="prof" value="${k}" ${i?'':'checked'}><span><b>${PROFILES[k].r}</b></span></label>`).join('')}</div></fieldset>`:''};
  const wrongTab=m=>{if(!m)return false;
   if(!col&&isStaff(m)){$('#login-msg').innerHTML=banner('info','Esta es una cuenta de colaborador','Las cuentas @ancoa.cl entran por la pestaña Colaboradores.',`<div class="row" style="margin-top:8px"><a class="btn btn-secondary btn-sm" href="#colaboradores" data-carry>Ir a Colaboradores</a></div>`);return true}
   if(col&&isFilial(m)){$('#login-msg').innerHTML=banner('info','Esta cuenta pertenece a la Filial emisora','El personal de la Filial entra por el acceso financiero, con su propia cuenta y segundo factor.',`<div class="row" style="margin-top:8px"><a class="btn btn-secondary btn-sm" href="#filial" data-carry style="color:var(--filial-fg)">Ir al acceso financiero</a></div>`);return true}
   if(col&&(V.email(m)||V.rut(m))&&!isStaff(m)){$('#login-msg').innerHTML=banner('info','Esta parece una cuenta de cliente','Para comprar o revisar tus pedidos usa la pestaña Clientes.',`<div class="row" style="margin-top:8px"><a class="btn btn-secondary btn-sm" href="#acceso" data-carry>Ir a Clientes</a></div>`);return true}
   $('#login-msg').innerHTML='';return false};
  mail.oninput=()=>{const v=mail.value.trim();const ok=col?V.email(v):(V.email(v)||V.rut(v));setValid('l-mail',v?ok:null,ok?'Formato correcto':col?'Escribe tu usuario completo, por ejemplo nombre@ancoa.cl':'Escribe un correo o un RUT con dígito verificador');profPick();if(ok)wrongTab(norm(v))};
  $('#login-msg').addEventListener('click',e=>{if(e.target.closest('[data-carry]'))S.loginPrefill=mail.value.trim()});
  $('#l-eye').onclick=e=>{const s=pass.type==='password';pass.type=s?'text':'password';e.currentTarget.setAttribute('aria-pressed',s);e.currentTarget.setAttribute('aria-label',s?'Ocultar contraseña':'Mostrar contraseña')};
  if(mail.value)mail.oninput();
  $('#f-login').onsubmit=async e=>{e.preventDefault();const m=norm(mail.value);const fmt=col?V.email(m):(V.email(m)||V.rut(m));
   const ok=setValid('l-mail',fmt,fmt?'':col?'Ingresa tu usuario corporativo':'Ingresa un correo o RUT válido');const okp=setValid('l-pass',pass.value.length>0?null:false,'Ingresa tu contraseña');if(!ok||okp===false)return;
   if(wrongTab(m))return;
   await busy($('#l-go'),900,'Verificando…');const acc=ACCOUNTS[m];
   if(!acc||pass.value!=='Ancoa2026'){tries--;$('#login-msg').innerHTML=banner('err',col?'Usuario o contraseña incorrectos':'Datos de acceso incorrectos',`Revisa ambos datos. Te quedan ${tries} intentos antes de bloquear temporalmente el acceso.`);pass.select();return}
   if(!acc.length){$('#login-msg').innerHTML=banner('err','Acceso denegado','La administración suspendió esta cuenta. Escribe a mesadeayuda@ancoa.cl para reactivarla. El intento quedó registrado.');return}
   const pick=$('input[name=prof]:checked')?.value||acc[0];S.pending={prof:pick,mail:m,from:col?'colaboradores':'acceso'};go('segundo-factor')}}}}

VIEWS.colaboradores=()=>loginView('col');

/* ================= V05 Segundo factor y recuperación ================= */
VIEWS['segundo-factor']=()=>{const pend=S.pending||{prof:'cliente',mail:'valentina.rojas@correo.cl'};const fil=PROFILES[pend.prof].scope==='filial';if(fil)document.body.dataset.scope='filial';
 return {rev:{html:`<div class="rp-btns"><button id="o-fill">Escribir el código 482913</button><button id="o-exp">Simular código vencido</button></div>`,note:'Un código distinto de 482913 muestra el error; tres errores bloquean el acceso.'},crumbs:[['Inicio','inicio'],[pend.from==='colaboradores'?'Entrar · Colaboradores':pend.from==='filial'?'Acceso financiero':'Entrar',pend.from||'acceso'],['Segundo factor']],title:'Confirma que eres tú',lead:`Enviamos un código de 6 dígitos al teléfono terminado en 4821. ${fil?'Tu acceso a la Filial emisora requiere su propio segundo factor.':''}`,
 body:`<div class="auth stack"><form class="card stack" id="f-otp" novalidate>${steps(['Credenciales','Segundo factor','Inicio'],1)}<div id="otp-msg" aria-live="assertive"></div>
 <fieldset style="border:0;padding:0;margin:0" class="stack-sm"><legend class="lbl small"><b>Código de verificación</b></legend><div class="otp">${[0,1,2,3,4,5].map(i=>`<input inputmode="numeric" maxlength="1" aria-label="Dígito ${i+1}" id="o${i}">`).join('')}</div><span class="hint xs muted">Vence en <b id="otp-t" class="num">04:59</b>.</span></fieldset>
 <button class="btn btn-primary btn-block" id="o-go">Verificar</button>
 <div class="row-between small"><button type="button" class="btn btn-tertiary btn-sm" id="o-re" disabled>Reenviar código (<span id="o-cd">10</span>)</button></div>
 <a class="small" href="#recuperar">No tengo acceso a este teléfono</a></form></div>`,
 mount(){const ins=$$('.otp input');let expired=false,tries=3;ins[0].focus();
  ins.forEach((x,i)=>{x.oninput=()=>{x.value=x.value.replace(/\D/g,'');if(x.value&&ins[i+1])ins[i+1].focus()};x.onkeydown=e=>{if(e.key==='Backspace'&&!x.value&&ins[i-1])ins[i-1].focus()};x.onpaste=e=>{const t=(e.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,6);if(t){e.preventDefault();t.split('').forEach((c,j)=>ins[j]&&(ins[j].value=c));ins[Math.min(5,t.length)].focus()}}});
  let cd=10;const ti=setInterval(()=>{if(!$('#o-cd'))return clearInterval(ti);cd--;$('#o-cd').textContent=cd;if(cd<=0){clearInterval(ti);$('#o-re').disabled=false;$('#o-re').textContent='Reenviar código'}},1000);
  let sec=299;const t2=setInterval(()=>{if(!$('#otp-t'))return clearInterval(t2);sec--;$('#otp-t').textContent=`0${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`},1000);
  bind('#o-fill','click',()=>{'482913'.split('').forEach((c,i)=>ins[i].value=c);$('#o-go').focus()});bind('#o-exp','click',()=>{expired=true;$('#otp-t').textContent='00:00';$('#otp-msg').innerHTML=banner('warn','El código venció','Por seguridad dura 5 minutos. Pide uno nuevo; el anterior ya no sirve.')});
  $('#o-re').onclick=()=>{expired=false;ins.forEach(x=>x.value='');ins[0].focus();$('#otp-msg').innerHTML=banner('info','Enviamos un código nuevo','Revisa los mensajes del teléfono terminado en 4821.');toast('Código reenviado.','info')};
  $('#f-otp').onsubmit=async e=>{e.preventDefault();const c=ins.map(x=>x.value).join('');if(c.length<6){$('#otp-msg').innerHTML=banner('err','Faltan dígitos','Ingresa los 6 dígitos del código.');ins[c.length].focus();return}
   await busy($('#o-go'),800,'Verificando…');
   if(expired){$('#otp-msg').innerHTML=banner('err','Ese código ya venció','Usa «Reenviar código» para recibir uno nuevo.');return}
   if(c!=='482913'){tries--;$('#otp-msg').innerHTML=banner('err','Código incorrecto',tries>0?`Te quedan ${tries} intentos.`:'Bloqueamos el acceso por 15 minutos. Puedes recuperar el acceso.');ins.forEach(x=>x.value='');ins[0].focus();return}
   setProfile(pend.prof);if(pend.prof==='ejecutivo')S.filialAuth=true;S.pending=null;toast(`Bienvenida/o, ${PROFILES[pend.prof].n.split(' ')[0]}.`);go(PROFILES[pend.prof].home)}}}};

VIEWS.recuperar=()=>{const st=S.rec||0;const col=S.recFrom==='col';const back=col?'colaboradores':'acceso';const L=['Identificación','Medio','Código','Nueva contraseña','Listo'];
 const body=[
  `${field({id:'r-id',label:col?'Usuario corporativo o RUT':'Correo o RUT registrado',req:true,ph:col?'nombre@ancoa.cl o 12.345.678-5':'nombre@correo.cl o 12.345.678-5',hint:'Usamos el dato solo para encontrar tu cuenta.'})}`,
  `<fieldset style="border:0;padding:0;margin:0" class="stack-sm"><legend class="lbl small"><b>¿Dónde quieres recibir el código?</b></legend><div class="opt-cards"><label class="opt"><input type="radio" name="rm" checked><span><b>SMS</b><br><span class="small muted">${col?'Teléfono corporativo terminado en 1190':'Teléfono terminado en 4821'}</span></span></label><label class="opt"><input type="radio" name="rm"><span><b>Correo</b><br><span class="small muted">${col?'Correo personal de respaldo m••••@gmail.com':'v••••••@correo.cl'}</span></span></label></div></fieldset>`,
  `${field({id:'r-c',label:'Código recibido',req:true,ph:'6 dígitos',hint:'Lo enviamos al medio que elegiste.',attrs:'inputmode="numeric" maxlength="6"'})}`,
  `${field({id:'r-p',label:'Nueva contraseña',type:'password',req:true,hint:'Mínimo 10 caracteres, con mayúscula y número.'})}<div class="meter" aria-hidden="true"><i id="r-m" style="width:0"></i></div><span class="xs muted" id="r-ml" aria-live="polite">Seguridad: —</span>`,
  `${banner('ok','Contraseña actualizada','Cerramos las sesiones abiertas en otros dispositivos. Ya puedes entrar.')}<a class="btn btn-primary" href="#${back}">Ir a entrar</a>`][st];
 return {rev:{note:'Código de verificación de prueba: 482913. El RUT o correo debe tener formato válido.'},crumbs:[['Inicio','inicio'],[col?'Entrar · Colaboradores':'Entrar',back],['Recuperar acceso']],title:'Recuperar acceso',lead:col?'Restablece tu contraseña corporativa en cuatro pasos. Si tu cuenta está suspendida, escribe a mesadeayuda@ancoa.cl.':'Cuatro pasos breves. No necesitas llamar a nadie.',
 body:`<div class="auth"><form class="card stack" id="f-rec" novalidate>${steps(L,st)}<div id="r-msg" aria-live="assertive"></div>${body}${st<4?`<div class="row-between">${st?'<button type="button" class="btn btn-secondary" id="r-b">Atrás</button>':`<a class="btn btn-tertiary" href="#${back}">Cancelar</a>`}<button class="btn btn-primary" id="r-n">Continuar</button></div>`:''}</form></div>`,
 mount(){const nx=()=>{S.rec=st+1;rerender()};$('#r-b')&&($('#r-b').onclick=()=>{S.rec=st-1;rerender()});if(st===4)S.rec=0;
  if($('#r-p'))$('#r-p').oninput=e=>{const v=e.target.value;let s=0;if(v.length>=10)s++;if(/[A-Z]/.test(v))s++;if(/\d/.test(v))s++;if(/[^\w]/.test(v))s++;$('#r-m').style.width=s*25+'%';$('#r-ml').textContent='Seguridad: '+['muy baja','baja','media','buena','alta'][s]};
  $('#f-rec')&&($('#f-rec').onsubmit=async e=>{e.preventDefault();

 for(let k=0;k<80;k++){m=(lo+hi)/2;let pv=0;for(let j=1;j<=n;j++)pv+=(c+com)/Math.pow(1+m,j);if(pv>P)lo=m;else hi=m}
 return {cuota:c,cuotaTotal:c+com,tot,int:c*n-P,cae:(Math.pow(1+m,12)-1)*100}}

 {k:'solicita',eb:'Tarjeta nueva',h:'Tu primer año sin comisión de administración',p:'Solicítala en el mesón financiero de tu tienda. Te entregamos la hoja resumen con todos los costos antes de firmar.',cta:['Cómo solicitarla','como-solicitar'],art:()=>cardArt(),legal:'Exención de comisión de administración por 12 meses desde la apertura, para solicitudes aprobadas hasta el 31 de diciembre de 2026. '+LEGAL},
 {k:'avance',eb:'Avance en efectivo',h:'Avance desde $50.000 en hasta 24 cuotas',p:'Retíralo en cajas de cualquier tienda Ancoa. Simula tu cuota antes de pedirlo.',cta:['Simular mi cuota','sim'],art:()=>`<div class="sl-num"><span>$</span>50.000<small>desde</small></div>`,legal:'Sujeto a evaluación y a cupo disponible. Impuesto de timbres y estampillas incluido en el costo total. '+LEGAL},
 {k:'paga',eb:'Pago de tu tarjeta',h:'Paga tu estado de cuenta sin filas',p:'En cajas de las 22 tiendas, con transferencia o con pago automático desde tu cuenta bancaria.',cta:['Formas de pago','como-pagar'],art:()=>`${cardArt('7730')}<span class="sl-badge">${ic('check')}Pagado</span>`,legal:'El pago se refleja en tu cupo al día hábil siguiente. Fecha de facturación según tu contrato.'}
];
const BENEF=[
 {img:'img/trail-runner-sneaker--coral.webp',t:'20 % en Calzado',d:'Todos los martes de noviembre',tag:'Con Tarjeta Ancoa'},
 {img:'img/wireless-headphones--navy.webp',t:'6 cuotas sin interés',d:'Tecnología · 10 al 15 nov',tag:'Evento'},
 {img:'img/linen-cushion-cover--clay.webp',t:'15 % en Deco',d:'Fines de semana de noviembre',tag:'Con Tarjeta Ancoa'},
 {img:'img/hydrating-face-serum--main.webp',t:'3 × 2 en Belleza',d:'Marcas seleccionadas',tag:'Con Tarjeta Ancoa'}
];
VIEWS['filial-inicio']=()=>{const cur=S.slide||0;const sim=S.simF||(S.simF={monto:300000,n:12});const r=credito(sim.monto,sim.n);
 return {noHead:true,rev:{note:'Inicio público de la Filial emisora (V33). Los anuncios de crédito muestran CAE y costo total, como exige la normativa de publicidad de créditos. «Ingresar» lleva al acceso financiero separado, con cuenta y segundo factor propios. El portal de titulares no forma parte de este avance.'},body:`
${carHTML(SLIDES,'slide','Anuncios de Tarjeta Ancoa','V33 · Propuesto')}
<section class="quick" aria-label="Accesos rápidos">${[['card','Solicitar Tarjeta Ancoa','como-solicitar'],['chart','Simular cuotas','sim'],['cash','Pagar mi tarjeta','como-pagar'],['lock','Bloquear tarjeta','bloquear'],['store','Mesones financieros','mesones']].map(([i,l,a])=>`<button class="qa" data-fa="${a}"><span class="qa-ic">${ic(i)}</span><span>${l}</span></button>`).join('')}</section>
<section class="stack" aria-labelledby="h-ben"><div class="row-between"><h2 id="h-ben">Beneficios de noviembre</h2><button class="btn btn-tertiary btn-sm" data-fa="cond-benef">Ver condiciones</button></div>
 <div class="benef">${BENEF.map(b=>`<article class="bcard"><div class="b-ph"><img src="${b.img}" alt="" loading="lazy" width="640" height="640"><span class="b-tag">${b.tag}</span></div><div class="b-tx"><h3>${b.t}</h3><p class="small muted">${b.d}</p></div></article>`).join('')}</div></section>
<section class="card sim" id="sim" aria-labelledby="h-sim"><div class="stack"><span class="eyebrow">Simulador de compra en cuotas</span><h2 id="h-sim">¿Cuánto pagarías al mes?</h2>
  <div class="field"><label for="sm-m">Monto de la compra</label><div class="row" style="flex-wrap:nowrap"><input type="range" id="sm-r" min="50000" max="2000000" step="10000" value="${sim.monto}" aria-label="Monto con control deslizante" style="flex:1;accent-color:var(--filial)"><input class="input num" id="sm-m" inputmode="numeric" value="${fmtN(sim.monto)}" style="width:140px;text-align:right"></div><span class="hint">Entre $50.000 y $2.000.000</span><span class="msg" id="sm-m-m"></span></div>
  <fieldset class="field" style="border:0;padding:0;margin:0"><legend class="lbl">Número de cuotas</legend><div class="chips">${[3,6,12,18,24].map(n=>`<button type="button" class="chip" data-sn="${n}" aria-pressed="${sim.n===n}">${n}</button>`).join('')}</div></fieldset></div>
 <div class="sim-out" aria-live="polite"><span class="xs muted">Valor cuota mensual</span><span class="sim-big num">${clp(r.cuotaTotal)}</span>
  <dl class="kv"><dt>Cuota de crédito</dt><dd class="num">${clp(r.cuota)}</dd><dt>Comisión mensual</dt><dd class="num">${clp(FIN.com)}</dd><dt>Intereses totales</dt><dd class="num">${clp(r.int)}</dd><dt>Costo total del crédito</dt><dd class="num">${clp(r.tot)}</dd><dt>CAE</dt><dd class="num">${pct(r.cae)}</dd><dt>Tasa de interés mensual</dt><dd class="num">${pct(FIN.tasa*100,2)}</dd></dl>
  <p class="xs muted">Valores referenciales. La oferta definitiva se informa en la hoja resumen antes de firmar y depende de la evaluación.</p><button class="btn btn-primary" data-fa="como-solicitar">Solicitar Tarjeta Ancoa</button></div></section>
<section class="grid g2"><div class="card stack-sm"><h2>Requisitos para solicitarla</h2><ul class="small" style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px"><li>Ser mayor de 18 años.</li><li>Cédula de identidad chilena vigente.</li><li>Acreditar ingresos: última liquidación de sueldo, boleta de honorarios o pensión.</li><li>Firmar la hoja resumen y el contrato en el mesón financiero.</li></ul></div>
 <div class="card stack-sm"><h2>¿Ya tienes tu Tarjeta Ancoa?</h2><p class="small muted">Revisa tu estado de cuenta, tu cupo y tus próximas cuotas en el mesón financiero o en tu boleta de compra.</p><div class="row"><button class="btn btn-secondary" data-fa="como-pagar">Pagar mi tarjeta</button><button class="btn btn-tertiary" data-fa="bloquear">Bloquear por robo o extravío</button></div></div></section>
<footer class="fin-foot small"><div class="row-between" style="align-items:flex-start"><div class="stack-sm" style="max-width:70ch"><b>Tarjeta Ancoa</b><p class="xs muted">Tarjeta de crédito emitida y administrada por la Filial emisora de Multitiendas Ancoa S.A. Infórmese sobre las entidades autorizadas para emitir tarjetas de pago en el país, quienes se encuentran inscritas en los Registros de Emisores de Tarjetas que lleva la Comisión para el Mercado Financiero, en www.cmfchile.cl.</p><p class="xs muted">${LEGAL}</p></div><div class="stack-sm"><a href="#inicio">Ir a Ancoa Retail</a><a href="#filial">Acceso personal Filial</a><button class="btn btn-tertiary btn-sm" data-fa="cond-benef" style="padding:0">Condiciones de beneficios</button></div></div></footer>`,
 mount(el){S.slide=S.slide||0;
  carMount(el,SLIDES,'slide','filial-inicio');
  const upd=v=>{const x=Math.max(50000,Math.min(2000000,v));S.simF.monto=x;rerender()};
  $('#sm-r').onchange=e=>upd(+e.target.value);$('#sm-r').oninput=e=>{$('#sm-m').value=fmtN(+e.target.value)};
  $('#sm-m').onchange=e=>{const v=+e.target.value.replace(/\D/g,'');if(v<50000||v>2000000){setValid('sm-m',false,'Usa un monto entre $50.000 y $2.000.000');return}upd(v)};
  $$('[data-sn]',el).forEach(b=>b.onclick=()=>{S.simF.n=+b.dataset.sn;rerender()});
  el.addEventListener('click',e=>{const b=e.target.closest('[data-fa]');if(!b)return;finAction(b.dataset.fa)})}}};

function finAction(a){
 const mes=`<ul class="files">${[['Insignia Santiago','Un mesón en cada piso · lun a dom 10:00 a 21:00'],['Viña del Mar','Piso 1, junto a cajas · 10:00 a 21:00'],['Concepción','Piso 2 · 10:00 a 21:00'],['La Serena','Piso 1 · 10:00 a 20:30'],['Temuco','Piso 1 · 10:00 a 20:30'],['Coyhaique','Junto a cajas · 10:00 a 20:00']].map(([t,d])=>`<li>${ic('store')}<span class="grow"><b>Tienda ${t}</b><br><span class="xs muted">${d}</span></span></li>`).join('')}</ul>`;
 if(a==='sim'){$('#sim')?.scrollIntoView({behavior:'smooth',block:'start'});setTimeout(()=>$('#sm-m')?.focus({preventScroll:true}),400);return}
 const M={
  'cond-cuotas':['Condiciones · cuotas sin interés',`<p class="small">Válido del 10 al 15 de noviembre de 2026 en la categoría Tecnología, en tiendas Ancoa y ancoa.cl, pagando con Tarjeta Ancoa.</p><ul class="small" style="margin:0;padding-left:18px"><li>Compra mínima $49.990.</li><li>Aplica en 3 y 6 cuotas. CAE 0 %. Costo total igual al precio de la compra.</li><li>No acumulable con otras promociones ni con cuotas diferidas.</li><li>Sujeto a cupo disponible.</li></ul>`],
  'como-solicitar':['Cómo solicitar tu Tarjeta Ancoa',`<ol class="small" style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px"><li>Acércate al mesón financiero de tu tienda con tu cédula vigente y un respaldo de ingresos.</li><li>Una ejecutiva de la Filial ingresa tu solicitud.</li><li>Te entregamos la hoja resumen con la tasa, la comisión, la CAE y el costo total. La revisas antes de firmar.</li><li>Si aceptas y tu solicitud es aprobada, te entregamos la tarjeta en el momento.</li></ol>${banner('info','Tus datos de crédito son de la Filial','La información de tu tarjeta no se comparte con Ancoa Retail. En caja solo se informa si una compra fue autorizada.')}<h3 style="font-size:var(--t-md)">Mesones financieros</h3>${mes}`],
  'como-pagar':['Formas de pagar tu tarjeta',`<ul class="files"><li>${ic('store')}<span class="grow"><b>En cajas de cualquier tienda Ancoa</b><br><span class="xs muted">Con efectivo o débito, indicando tu RUT</span></span></li><li>${ic('swap')}<span class="grow"><b>Transferencia bancaria</b><br><span class="xs muted">A la cuenta recaudadora de la Filial emisora, indicando tu RUT en el mensaje</span></span></li><li>${ic('sync')}<span class="grow"><b>Pago automático</b><br><span class="xs muted">Cargo mensual a tu cuenta bancaria; se inscribe en el mesón financiero</span></span></li></ul><p class="xs muted">El pago se refleja en tu cupo al día hábil siguiente.</p>`],
  'bloquear':['Bloquear tu tarjeta',`${banner('warn','Bloquéala apenas notes el robo o la pérdida','Llama al Servicio al Titular de la Filial, opción 1, disponible las 24 horas. Desde el bloqueo no eres responsable de compras no reconocidas.')}<p class="small">También puedes bloquearla en el mesón financiero de cualquier tienda presentando tu cédula. Te entregaremos un comprobante con número de bloqueo.</p>`],
  'mesones':['Mesones financieros',`<p class="small muted">Atención de la Tarjeta Ancoa en horario de tienda.</p>${mes}`],
  'cond-benef':['Condiciones de beneficios de noviembre',`<ul class="small" style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px"><li><b>20 % en Calzado:</b> martes 10, 17 y 24 de noviembre de 2026, sobre precio normal, pagando con Tarjeta Ancoa.</li><li><b>6 cuotas sin interés:</b> Tecnología, 10 al 15 de noviembre, compra mínima $49.990. CAE 0 %.</li><li><b>15 % en Deco:</b> sábados y domingos de noviembre, sobre precio normal.</li><li><b>3 × 2 en Belleza:</b> marcas seleccionadas; se descuenta el producto de menor precio.</li></ul><p class="xs muted">Beneficios no acumulables entre sí. Válidos en tiendas Ancoa y ancoa.cl hasta agotar stock. ${LEGAL}</p>`]
 }[a];
 if(M)modal({title:M[0],body:M[1],wide:a==='como-solicitar',actions:[{label:'Cerrar',cls:'btn-primary'}]})}
document.body.dataset.scope="retail"; render();
</script>

</body></html>
